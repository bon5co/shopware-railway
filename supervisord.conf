[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; first boot installs the shop, every later boot migrates it; worker and scheduler wait for it to finish
[program:install]
user=www-data
command=/bin/sh -c '/setup && touch /tmp/shopware-installed'
directory=/var/www/html
autorestart=false
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0

[program:php-fpm]
user=www-data
command=/usr/local/sbin/php-fpm
redirect_stderr=true
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0

[program:nginx]
user=www-data
command=/usr/sbin/nginx -e /tmp/error.log
redirect_stderr=true
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0

[program:worker]
user=www-data
command=/bin/sh -c 'until [ -f /tmp/shopware-installed ]; do sleep 3; done; exec php bin/console messenger:consume async low_priority --time-limit=300 --memory-limit=512M'
directory=/var/www/html
autorestart=true
startretries=1000000
redirect_stderr=true
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0

[program:scheduler]
user=www-data
command=/bin/sh -c 'until [ -f /tmp/shopware-installed ]; do sleep 3; done; exec php bin/console scheduled-task:run'
directory=/var/www/html
autorestart=true
startretries=1000000
redirect_stderr=true
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0

; forwards the www-data logs (written to files, see railway-boot.sh) to the container log; runs as root
[program:logs]
command=tail -F -n 0 /tmp/log/nginx-error.log /tmp/log/nginx-access.log /tmp/log/php-fpm.log
redirect_stderr=true
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0
